<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>FocusCard · 专注卡片 (v3)</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4D66EB"/>
      <stop offset="1" stop-color="#141C54"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- Body: macOS icon grid (824 pt square, 100 pt margin) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)" filter="url(#shadow)"/>
  <!-- Progress ring: track and a 75% arc that starts at 12 o'clock -->
  <circle cx="512" cy="512" r="268" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="40"/>
  <path d="M512 244 A268 268 0 1 1 244 512" fill="none" stroke="#66F2D1" stroke-width="40" stroke-linecap="round"/>
  <!-- Hourglass (drawn to match the SF Symbols "hourglass" used in the app) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M412 382 H612"/>
    <path d="M412 642 H612"/>
    <path d="M432 382 C432 452 492 482 512 512 C532 482 592 452 592 382"/>
    <path d="M432 642 C432 572 492 542 512 512 C532 542 592 572 592 642"/>
  </g>
  <path d="M462 622 C470 590 498 576 512 566 C526 576 554 590 562 622 Z" fill="#FFFFFF"/>
</svg>
